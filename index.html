            const apiEndpoints = [
                'http://60.205.94.101:8080/update/update.json',
                'https://cors-anywhere.herokuapp.com/http://60.205.94.101:8080/update/update.json', // CORS代理
                'https://api.allorigins.win/raw?url=http://60.205.94.101:8080/update/update.json' // 另一个CORS代理
            ];
            
            for (const endpoint of apiEndpoints) {
                try {
                    console.log('尝试获取更新信息:', endpoint);
                    const response = await fetch(endpoint, {
                        method: 'GET',
                        mode: 'cors',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP错误! 状态: ${response.status}`);
                    }
                    
                    const text = await response.text();
                    console.log('获取到的响应:', text);
                    
                    // 尝试解析JSON
                    try {
                        oldchatUpdateInfo = JSON.parse(text);
                        console.log('解析成功:', oldchatUpdateInfo);
                        
                        // 更新下载链接
                        updateDownloadLink();
                        return; // 成功后退出
                    } catch (parseError) {
                        console.error('JSON解析错误:', parseError);
                    }
                } catch (error) {
                    console.error('请求失败:', endpoint, error.message);
                    // 继续尝试下一个端点
                }
            }
            
            // 所有尝试都失败，使用默认值
            console.log('所有API尝试失败，使用默认下载地址');
            versionTag.textContent = '官网下载';
            downloadUrl = 'https://oldchat.online';
            document.getElementById('downloadLink').href = downloadUrl;
        }
        
        // 更新下载链接
        function updateDownloadLink() {
            const downloadLink = document.getElementById('downloadLink');
            const versionTag = document.getElementById('versionTag');
            
            if (oldchatUpdateInfo && oldchatUpdateInfo.apk) {
                // 构建下载URL
                downloadUrl = `http://60.205.94.101:8080/update/${oldchatUpdateInfo.apk}`;
                downloadLink.href = downloadUrl;
                
                // 显示版本信息
                versionTag.textContent = `v${oldchatUpdateInfo.version_name || '?'}`;
                
                // 如果强制更新，添加提示
                if (oldchatUpdateInfo.force) {
                    downloadLink.style.background = 'linear-gradient(135deg, #e67e22, #d35400)';
                    versionTag.textContent += ' (强制)';
                }
                
                console.log('下载链接已更新:', downloadUrl);
            } else {
                // 使用随机镜像作为备用
                const randomMirror = downloadMirrors[Math.floor(Math.random() * downloadMirrors.length)];
                downloadUrl = randomMirror;
                downloadLink.href = downloadUrl;
                versionTag.textContent = '官网下载';
                console.log('使用备用下载地址:', downloadUrl);
            }
        }
        
        // 打开旧聊应用的函数
        function openOldChatApp(groupCode) {
            // 尝试通过intent打开应用（Android）
            const intentUrl = `intent://#Intent;scheme=oldchat;package=com.im.oldchat;S.${groupCode};end`;
            
            // 尝试通过自定义URL scheme打开应用
            const schemeUrl = `oldchat://join?group=${groupCode}`;
            
            // 尝试打开应用
            if (navigator.userAgent.toLowerCase().indexOf('android') > -1) {
                // Android设备
                window.location.href = intentUrl;
            } else {
                // iOS设备或其他
                window.location.href = schemeUrl;
            }
            
            // 设置一个定时器，如果应用没有打开，则询问是否下载
            setTimeout(function() {
                if (confirm('未检测到旧聊应用，是否前往下载？')) {
                    window.location.href = downloadUrl;
                }
            }, 500);
            
            return false;
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            const websitesContainer = document.getElementById('websitesContainer');
            const searchInput = document.getElementById('searchInput');
            const websiteCountElement = document.getElementById('websiteCount');
            
            let currentSearch = '';
            let websites = []; // 存储加载的数据
            
            // 从URL获取域名用于favicon
            function getDomainFromUrl(url) {
                try {
                    const urlObj = new URL(url);
                    return urlObj.hostname;
                } catch (e) {
                    return null;
                }
            }
            
            // 获取网站的favicon URL（使用多种服务作为备选）
            function getFaviconUrl(url) {
                const domain = getDomainFromUrl(url);
                if (!domain) return null;
                
                // 返回一个包含多种favicon来源的数组，按优先级排序
                return [
                    `https://www.google.com/s2/favicons?domain=${domain}&sz=64`, // Google Favicon服务
                    `https://favicon.yandex.net/favicon/${domain}`, // Yandex Favicon服务
                    `https://icon.horse/icon/${domain}`, // Icon Horse服务
                    `https://${domain}/favicon.ico` // 直接访问网站的favicon.ico
                ];
            }
            
            // 从外部JSON文件加载数据
            async function loadData() {
                try {
                    // 显示加载状态
                    websitesContainer.innerHTML = `
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>正在加载网址数据...</p>
                        </div>
                    `;
                    
                    // 使用fetch从外部JSON文件加载数据
                    const response = await fetch('websites.json');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP错误! 状态: ${response.status}`);
                    }
                    
                    const text = await response.text();
                    
                    // 尝试解析JSON
                    try {
                        websites = JSON.parse(text);
                    } catch (parseError) {
                        console.error('JSON解析错误:', parseError);
                        throw new Error(`JSON格式错误: ${parseError.message}`);
                    }
                    
                    // 数据加载成功后，显示网站
                    loadWebsites();
                    
                } catch (error) {
                    console.error('加载数据失败:', error);
                    
                    // 显示错误信息
                    websitesContainer.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 15px;"></i>
                            <h3>数据加载失败</h3>
                            <p>无法加载网址数据，请检查websites.json文件是否存在且格式正确。</p>
                            <p style="margin-top: 10px; font-size: 0.9rem;">错误信息: ${error.message}</p>
                            <p style="margin-top: 10px; font-size: 0.9rem;">请检查JSON文件格式，确保没有注释和多余的逗号。</p>
                            <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">
                                <i class="fas fa-redo"></i> 重新加载
                            </button>
                        </div>
                    `;
                }
            }
            
            // 根据displayType返回对应的CSS类名
            function getDisplayBoxClass(displayType) {
                const typeMap = {
                    'tag': 'tag',
                    'status': 'status',
                    'info': 'info',
                    'warning': 'warning',
                    'custom': 'custom'
                };
                
                return typeMap[displayType] || 'custom';
            }
            
            // 尝试加载favicon，如果失败则尝试下一个来源
            function loadFaviconWithFallback(imgElement, faviconUrls, index = 0) {
                if (index >= faviconUrls.length) {
                    // 所有来源都失败，显示备用图标
                    imgElement.style.display = 'none';
                    const fallback = imgElement.nextElementSibling;
                    if (fallback && fallback.classList.contains('fallback-icon')) {
                        fallback.style.display = 'flex';
                    }
                    return;
                }
                
                imgElement.src = faviconUrls[index];
                imgElement.onerror = function() {
                    loadFaviconWithFallback(imgElement, faviconUrls, index + 1);
                };
                imgElement.onload = function() {
                    imgElement.style.display = 'block';
                    const fallback = imgElement.nextElementSibling;
                    if (fallback && fallback.classList.contains('fallback-icon')) {
                        fallback.style.display = 'none';
                    }
                };
            }
            
            // 加载并显示网站
            function loadWebsites() {
                // 过滤网站（只根据搜索词过滤）
                let filteredWebsites = websites.filter(website => {
                    const matchesSearch = !currentSearch || 
                        website.name.toLowerCase().includes(currentSearch.toLowerCase()) || 
                        website.description.toLowerCase().includes(currentSearch.toLowerCase());
                    
                    return matchesSearch;
                });
                
                // 清空容器
                websitesContainer.innerHTML = '';
                
                // 显示网站数量
                websiteCountElement.textContent = filteredWebsites.length;
                
                // 如果没有找到结果
                if (filteredWebsites.length === 0) {
                    websitesContainer.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-search fa-2x" style="margin-bottom: 15px;"></i>
                            <p>未找到匹配的网站，请尝试其他搜索词</p>
                        </div>
                    `;
                    return;
                }
                
                // 创建网站卡片
                filteredWebsites.forEach(website => {
                    const websiteCard = document.createElement('div');
                    websiteCard.className = 'website-card';
                    
                    // 获取favicon URL列表
                    const faviconUrls = getFaviconUrl(website.url);
                    
                    // 生成备用图标的背景色（基于网站名称生成固定颜色）
                    const hash = website.name.split('').reduce((acc, char) => char.charCodeAt(0) + acc, 0);
                    const hue = hash % 360;
                    const fallbackColor = `hsl(${hue}, 70%, 60%)`;
                    
                    // 创建图标HTML
                    let iconHTML = '';
                    if (faviconUrls) {
                        iconHTML = `
                            <div class="website-icon">
                                <img src="" alt="${website.name} icon" style="display: none;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div class="fallback-icon" style="display: flex; background: ${fallbackColor};">
                                    ${website.name.charAt(0).toUpperCase()}
                                </div>
                            </div>
                        `;
                    } else {
                        iconHTML = `
                            <div class="website-icon">
                                <div class="fallback-icon" style="display: flex; background: ${fallbackColor};">
                                    ${website.name.charAt(0).toUpperCase()}
                                </div>
                            </div>
                        `;
                    }
                    
                    // 检查是否有展示框数据
                    let displayBoxHTML = '';
                    if (website.displayText && website.displayText.trim() !== '') {
                        const displayType = website.displayType || 'custom';
                        const displayClass = getDisplayBoxClass(displayType);
                        displayBoxHTML = `<div class="display-box ${displayClass}">${website.displayText}</div>`;
                    }
                    
                    websiteCard.innerHTML = `
                        ${iconHTML}
                        <div class="website-name">${website.name}</div>
                        <div class="website-desc">${website.description}</div>
                        <a href="${website.url}" target="_blank" class="website-link">
                            访问网站 <i class="fas fa-external-link-alt" style="margin-left: 5px;"></i>
                        </a>
                        ${displayBoxHTML}
                    `;
                    
                    websitesContainer.appendChild(websiteCard);
                    
                    // 尝试加载favicon
                    if (faviconUrls) {
                        const img = websiteCard.querySelector('img');
                        const fallback = websiteCard.querySelector('.fallback-icon');
                        
                        // 尝试加载第一个favicon来源
                        loadFaviconWithFallback(img, faviconUrls, 0);
                    }
                });
            }
            
            // 搜索框输入事件
            searchInput.addEventListener('input', function() {
                currentSearch = this.value;
                loadWebsites();
            });
            
            // 添加一个简单的动画效果给域名提示区域
            const domainNotice = document.querySelector('.domain-notice');
            domainNotice.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.02)';
                this.style.transition = 'transform 0.3s ease';
            });
            
            domainNotice.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
            
            // 获取旧聊更新信息
            fetchOldchatUpdateInfo();
            
            // 初始加载数据
            loadData();
        });
    </script>
</body>
</html>
