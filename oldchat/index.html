<!DOCTYPE HTML>

  <head>
    <meta charset="utf-8" />

    <style>
    /* reset and base styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background-color: #f9f9f9;
  color: #333;
  line-height: 1.6;
  padding: 2rem 1rem;
  max-width: 800px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  margin-bottom: 2rem;
  font-size: 2rem;
  color: #2c3e50;
}

a {
  display: block;
  margin: 0.75rem 0;
  padding: 0.75rem 1rem;
  background-color: #eef2ff;
  color: #4f46e5;
  text-decoration: none;
  border-radius: 8px;
  transition: all 0.2s ease;
  font-weight: 600;
}

a:hover {
  background-color: #d1d5db;
  transform: translateY(-2px);
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

p {
  margin: 1.25rem 0;
  text-align: center;
  color: #6b7280;
  font-size: 0.9rem;
}

/* 分隔线样式优化 */
p:nth-of-type(2),
p:nth-of-type(4),
p:nth-of-type(6) {
  margin: 1.5rem 0;
  font-size: 1.2rem;
  color: #94a3b8;
}

/* 响应式调整 */
@media (max-width: 600px) {
  body {
    padding: 1.5rem 0.8rem;
  }

  h1 {
    font-size: 1.6rem;
  }

  a {
    padding: 0.6rem 0.8rem;
    font-size: 0.95rem;
  }
}
